{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Demande envoyée — HexaQuébec
</title>

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
}

body{

    min-height:100vh;

    margin:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    color:#fff;

    font-family:'Poppins',sans-serif;

    background:

        radial-gradient(
            circle at top,
            rgba(124,92,255,.23),
            transparent 40%
        ),

        #050816;
}

.card{

    width:100%;

    max-width:630px;

    padding:
        50px 35px;

    text-align:center;

    border-radius:32px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:
        0 35px 90px rgba(0,0,0,.45);
}

.icon{

    width:90px;
    height:90px;

    margin:
        0 auto
        25px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:30px;

    color:#fff;

    font-size:35px;

    background:

        linear-gradient(
            135deg,
            #7c5cff,
            #00b6e9
        );

    box-shadow:
        0 20px 45px rgba(0,182,233,.23);
}

h1{

    font-size:
        clamp(29px,5vw,43px);

    line-height:1.1;

    font-weight:900;
}

h1 span{

    color:#7de7ff;
}

p{

    max-width:480px;

    margin:
        18px auto
        30px;

    color:
        rgba(255,255,255,.62);

    line-height:1.8;

    font-size:13px;
}

a{

    min-height:50px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    padding:
        0 20px;

    border-radius:14px;

    color:#fff;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    background:

        linear-gradient(
            135deg,
            #7357ff,
            #009ed9
        );
}

</style>

</head>

<body>

<div class="card">

    <div class="icon">

        <i class="fa-solid fa-check"></i>

    </div>

    <h1>

        Demande

        <span>
            envoyée
        </span>

    </h1>

    <p>

        Merci. Votre demande de visioconférence
        a bien été transmise à HexaQuébec.

        <br><br>

        Après confirmation,
        vous recevrez votre lien privé
        de conférence directement par courriel.

    </p>

    <a href="{% url 'home' %}">

        <i class="fa-solid fa-house"></i>

        Retour à HexaQuébec

    </a>

</div>

</body>
</html>
