{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Conférence HexaQuébec — {{ conference.sujet }}
</title>

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    color:#fff;

    font-family:'Poppins',sans-serif;

    background:#050816;

    overflow:hidden;
}

.topbar{

    height:75px;

    padding:
        0 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    background:
        #070c1c;
}

.brand{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo{

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#fff;
}

.logo img{

    width:40px;
    height:40px;

    object-fit:contain;
}

.brand strong{

    display:block;

    font-size:14px;

    font-weight:900;
}

.brand small{

    display:block;

    color:#8be9ff;

    font-size:8px;
}

.status{

    display:flex;

    align-items:center;

    gap:7px;

    color:#52ffa9;

    font-size:9px;

    font-weight:700;
}

.status span{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#00e68a;

    box-shadow:
        0 0 12px #00e68a;
}

.room{

    width:100%;

    height:
        calc(100vh - 75px);

    background:#000;
}

.room iframe{

    width:100%;

    height:100%;

    border:0;
}

</style>

</head>

<body>


<header class="topbar">


    <div class="brand">

        <span class="logo">

            <img
                src="{% static 'images/logoHexa.png' %}"
                alt="HexaQuébec"
            >

        </span>

        <span>

            <strong>
                Conférence HexaQuébec
            </strong>

            <small>

                {{ conference.sujet }}

            </small>

        </span>

    </div>


    <div class="status">

        <span></span>

        Salle vidéo sécurisée

    </div>


</header>


<main class="room">

    <iframe
        src="https://meet.jit.si/{{ conference.room_name }}"
        allow="
            camera;
            microphone;
            fullscreen;
            display-capture;
            autoplay
        "
        allowfullscreen
    ></iframe>

</main>


</body>
</html>
