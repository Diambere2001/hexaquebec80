{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion Groupe Stagiaires</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top left,#2563eb33,transparent 30%),
        radial-gradient(circle at bottom right,#d4af3733,transparent 30%),
        #0b1120;
    font-family:Arial,sans-serif;
}

.login-card{
    width:100%;
    max-width:520px;
    background:rgba(17,24,39,.95);
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    padding:38px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo-icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    color:white;
    font-size:38px;
    box-shadow:0 15px 35px rgba(37,99,235,.4);
}

h2{
    color:white;
    text-align:center;
    margin-top:20px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:28px;
}

.choice-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:25px;
}

.choice-btn{
    background:#1e293b;
    color:white;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
    font-weight:800;
    text-decoration:none;
    transition:.3s;
}

.choice-btn:hover{
    color:white;
    transform:translateY(-3px);
    border-color:#2563eb;
}

.choice-btn i{
    display:block;
    font-size:28px;
    margin-bottom:8px;
    color:#d4af37;
}

.input-group-custom{
    position:relative;
    margin-bottom:16px;
}

.input-group-custom i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
}

.form-control{
    background:#1e293b;
    border:none;
    color:white;
    border-radius:16px;
    height:58px;
    padding-left:50px;
}

.form-control:focus{
    background:#1e293b;
    color:white;
    box-shadow:0 0 0 3px rgba(37,99,235,.2);
}

.btn-login{
    width:100%;
    height:58px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-size:17px;
    font-weight:800;
}

.btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(37,99,235,.35);
}

.footer-text{
    margin-top:20px;
    text-align:center;
    color:#94a3b8;
    font-size:14px;
}

.footer-text span{
    color:#d4af37;
    font-weight:800;
}

@media(max-width:576px){
    .login-card{
        margin:15px;
        padding:25px;
    }

    .choice-box{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo-icon">
        <i class="fa-solid fa-users"></i>
    </div>

    <h2>Groupe Stagiaires</h2>

    <p class="subtitle">
        Choisissez votre mode d'accès
    </p>

    <div class="choice-box">

        <a href="{% url 'groupe_stagiaires' %}" class="choice-btn">
            <i class="fa-solid fa-user-shield"></i>
            Admin
        </a>

        <a href="#stagiaireForm" class="choice-btn">
            <i class="fa-solid fa-user-graduate"></i>
            Stagiaire
        </a>

    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" id="stagiaireForm">
        {% csrf_token %}

        <div class="input-group-custom">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Adresse email stagiaire"
                required>
        </div>

        <div class="input-group-custom">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                name="code_stagiaire"
                class="form-control"
                placeholder="Code stagiaire"
                required>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i>
            Connexion stagiaire
        </button>

    </form>

    <div class="footer-text">
        Plateforme interne <span>HexaQuébec</span>
    </div>

</div>

</body>
</html>
